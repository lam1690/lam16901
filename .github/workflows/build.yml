name: Build Electron App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install
          npm run electron:build
          ls -la dist-electron/ || echo 'not found'
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: dist-electron/mac/
          retention-days: 7

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install
          npm run electron:build
      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: dist-electron/*.exe
          retention-days: 7
